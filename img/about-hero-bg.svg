<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 420" width="100%" height="100%" preserveAspectRatio="xMidYMid slice">
  <defs>
    <!-- Deep Navy Base Gradient -->
    <linearGradient id="dbHeroBase" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#04142e" />
      <stop offset="40%" stop-color="#072248" />
      <stop offset="75%" stop-color="#0b2e5c" />
      <stop offset="100%" stop-color="#051733" />
    </linearGradient>

    <!-- Ambient Glowing Highlights -->
    <radialGradient id="glowRed" cx="50%" cy="30%" r="45%">
      <stop offset="0%" stop-color="#ea262a" stop-opacity="0.18" />
      <stop offset="100%" stop-color="#ea262a" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="glowCyan" cx="20%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.16" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="glowPurple" cx="80%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#818cf8" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#818cf8" stop-opacity="0" />
    </radialGradient>

    <!-- Circle Glass Gradients -->
    <linearGradient id="glassCircle" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.18" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.04" />
    </linearGradient>
    <linearGradient id="glassCircleActive" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0.08" />
    </linearGradient>

    <!-- Dot Pattern -->
    <pattern id="techDots" x="0" y="0" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.2" fill="#ffffff" fill-opacity="0.07" />
    </pattern>
  </defs>

  <!-- Background Rect -->
  <rect width="1600" height="420" fill="url(#dbHeroBase)" />
  
  <!-- Ambient Radial Glows -->
  <rect width="1600" height="420" fill="url(#glowRed)" />
  <rect width="1600" height="420" fill="url(#glowCyan)" />
  <rect width="1600" height="420" fill="url(#glowPurple)" />

  <!-- Subtle Tech Grid / Dots Overlay -->
  <rect width="1600" height="420" fill="url(#techDots)" opacity="0.8" />

  <!-- Connecting Wave/Constellation Lines -->
  <g stroke="#38bdf8" stroke-opacity="0.18" stroke-width="1.2" fill="none">
    <path d="M-50 210 Q 300 120, 600 240 T 1200 180 T 1650 250" />
    <path d="M-50 280 Q 400 340, 800 210 T 1400 280 T 1650 160" stroke-dasharray="4 6" />
    <path d="M200 50 L 320 160 L 480 90 L 620 220" />
    <path d="M980 220 L 1120 110 L 1280 200 L 1420 80" />
  </g>

  <!-- LEFT FLANK: ENGAGEMENT & MARKETING ICONS (MATCHING SCREENSHOT) -->
  <!-- 1. Thumbs Up Circle Badge -->
  <g transform="translate(180, 110)">
    <circle cx="55" cy="55" r="54" fill="url(#glassCircleActive)" stroke="#38bdf8" stroke-width="1.5" stroke-opacity="0.3" />
    <circle cx="55" cy="55" r="44" fill="#00275b" fill-opacity="0.4" />
    <!-- Like / Thumbs Up SVG Icon -->
    <path d="M46 54 L46 66 C46 67.1 46.9 68 48 68 L52 68 C53.1 68 54 67.1 54 66 L54 54 Z M57 54 L57 66 C57 67.7 58.3 69 60 69 L67 69 C68.6 69 69.8 67.8 70 66.2 L71.5 54.2 C71.7 52.8 70.6 51.5 69.2 51.5 L63.5 51.5 L64.8 45.3 C65.1 43.8 64.2 42.4 62.7 42.1 C61.8 41.9 60.9 42.3 60.3 43 L56 49 L57 54 Z" fill="#ffffff" fill-opacity="0.65" />
  </g>

  <!-- 2. Laptop / Code Circle Badge -->
  <g transform="translate(320, 220)">
    <circle cx="45" cy="45" r="42" fill="url(#glassCircle)" stroke="#ffffff" stroke-width="1.2" stroke-opacity="0.2" />
    <path d="M32 50 L58 50 C59.1 50 60 49.1 60 48 L60 36 C60 34.9 59.1 34 58 34 L32 34 C30.9 34 30 34.9 30 36 L30 48 C30 49.1 30.9 50 32 50 Z M26 53 C26 53.6 26.4 54 27 54 L63 54 C63.6 54 64 53.6 64 53 L61 51 L29 51 Z" fill="#38bdf8" fill-opacity="0.6" />
  </g>

  <!-- 3. Small Accent Bubble -->
  <circle cx="110" cy="270" r="22" fill="url(#glassCircle)" stroke="#ffffff" stroke-opacity="0.15" />
  <circle cx="280" cy="80" r="14" fill="#38bdf8" fill-opacity="0.2" />

  <!-- CENTER BACKGROUND: TEAM SILHOUETTES & HANDSHAKE (MATCHING SCREENSHOT) -->
  <g transform="translate(680, 80)" fill="#38bdf8" fill-opacity="0.16">
    <!-- Person Left (Consultant / Leader) -->
    <circle cx="60" cy="50" r="26" />
    <path d="M20 190 L30 115 C30 92 48 78 72 78 C90 78 104 88 108 105 L96 190 Z" />
    
    <!-- Handshake Connection in Center -->
    <path d="M95 125 L125 140 L145 125 L125 110 Z" fill="#ffffff" fill-opacity="0.22" />
    <circle cx="120" cy="126" r="12" fill="#ea262a" fill-opacity="0.3" />

    <!-- Person Right (Client / Partner) -->
    <circle cx="180" cy="50" r="26" />
    <path d="M144 190 L132 105 C136 88 150 78 168 78 C192 78 210 92 210 115 L220 190 Z" />
  </g>

  <!-- RIGHT FLANK: SOCIAL & GROWTH BADGES (MATCHING SCREENSHOT) -->
  <!-- 1. Large Heart Circle Badge -->
  <g transform="translate(1310, 100)">
    <circle cx="60" cy="60" r="60" fill="url(#glassCircleActive)" stroke="#f43f5e" stroke-width="1.5" stroke-opacity="0.35" />
    <circle cx="60" cy="60" r="48" fill="#00275b" fill-opacity="0.4" />
    <!-- Heart SVG Icon -->
    <path d="M60 76 L57.8 74 C49.8 66.8 44.5 62 44.5 56 C44.5 51.1 48.3 47.3 53.2 47.3 C56 47.3 58.7 48.6 60 50.6 C61.3 48.6 64 47.3 66.8 47.3 C71.7 47.3 75.5 51.1 75.5 56 C75.5 62 70.2 66.8 62.2 74 Z" fill="#f43f5e" fill-opacity="0.75" />
  </g>

  <!-- 2. Megaphone / Marketing Circle Badge -->
  <g transform="translate(1180, 210)">
    <circle cx="45" cy="45" r="42" fill="url(#glassCircle)" stroke="#ffffff" stroke-width="1.2" stroke-opacity="0.2" />
    <path d="M48 35 L40 40 L35 40 C33.9 40 33 40.9 33 42 L33 48 C33 49.1 33.9 50 35 50 L40 50 L48 55 Z M51 38 C53 40.5 53 49.5 51 52 M54 34 C57 38 57 52 54 56 M38 50 L39 57 C39.3 58 40.5 58.5 41.5 58 C42.2 57.5 42.5 56.6 42.2 55.8 L41 50 Z" fill="#ffffff" fill-opacity="0.6" />
  </g>

  <!-- 3. Gears / Performance Badge -->
  <g transform="translate(1470, 230)">
    <circle cx="36" cy="36" r="34" fill="url(#glassCircle)" stroke="#38bdf8" stroke-width="1" stroke-opacity="0.2" />
    <circle cx="36" cy="36" r="10" stroke="#38bdf8" stroke-width="2.5" fill="none" opacity="0.6" stroke-dasharray="4 2" />
  </g>

  <circle cx="1520" cy="80" r="18" fill="url(#glassCircle)" stroke="#ffffff" stroke-opacity="0.1" />

  <!-- Bottom Accent Gradient Line -->
  <rect y="416" width="1600" height="4" fill="url(#screenGradLine)" />
  <linearGradient id="screenGradLine" x1="0%" y1="0%" x2="100%" y2="0%">
    <stop offset="0%" stop-color="#38bdf8" stop-opacity="0" />
    <stop offset="30%" stop-color="#38bdf8" stop-opacity="0.6" />
    <stop offset="50%" stop-color="#ea262a" stop-opacity="0.9" />
    <stop offset="70%" stop-color="#38bdf8" stop-opacity="0.6" />
    <stop offset="100%" stop-color="#38bdf8" stop-opacity="0" />
  </linearGradient>
</svg>

